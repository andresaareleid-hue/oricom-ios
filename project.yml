name: OriCom
options:
  bundleIdPrefix: biz.rakendus
  deploymentTarget:
    iOS: "14.0"
targets:
  OriCom:
    type: application
    platform: iOS
    sources: [OriCom]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: biz.rakendus.oricom
        INFOPLIST_FILE: OriCom/Info.plist
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
